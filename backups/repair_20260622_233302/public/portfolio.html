<div style="display:flex; gap:10px; padding:10px; background:#1a1a1a;"><a href="https://onroadnow-ggpe.vercel.app/crypto/crypto/koreruss-music.vercel.app" style="color:#f7931a;">Music</a><a href="https://onroadnow-ggpe.vercel.app/crypto/crypto/korerussbiz-signals.vercel.app" style="color:#f7931a;">Signals</a><a href="https://onroadnow-ggpe.vercel.app/crypto/crypto/onroadnow.vercel.app" style="color:#f7931a;">OnRoad</a></div>
    <div class="container">
      $NAV_HTML
      <div class="card">
        <h1>💼 Portfolio</h1>
        <div class="stat" id="balance">$0.00</div>
        <div class="stat" id="profit">$0.00</div>
        <div id="trades"></div>
        <button id="refreshBtn" class="btn">🔄 Refresh</button>
      </div>
    </div>
    <script>
      async function fetchData() {
        const res = await fetch("/api/trade/history", {
          credentials: "include",
        });
        const data = await res.json();
        let totalProfit = 0;
        let totalAmount = 0;
        let html = "<h3>Recent Trades</h3>";
        data
          .slice(-20)
          .reverse()
          .forEach((t) => {
            totalAmount += t.amountUSD || 0;
            totalProfit += t.profit || 0;
            html += `<div style="background:#0f172a;padding:0.5rem;border-radius:0.5rem;margin:0.3rem 0;">${t.symbol} – $${t.amountUSD} → profit $${(t.profit || 0).toFixed(4)}</div>`;
          });
        document.getElementById("balance").textContent =
          "$" + totalAmount.toFixed(2);
        document.getElementById("profit").textContent =
          "$" + totalProfit.toFixed(2);
        document.getElementById("trades").innerHTML = html;
      }
      document
        .getElementById("refreshBtn")
        .addEventListener("click", fetchData);
      fetchData();
    </script>
