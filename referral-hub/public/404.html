  <script>
    const routes = {

      "/go/music": "https://onroadnow-ggpe.vercel.app/crypto/crypto/vercel.app"
    };

    const params = new URLSearchParams(window.location.search);
    const requestedUrl = params.get("url") || params.get("to");
    const path = window.location.pathname.replace(/\/$/, "").toLowerCase();

    let target = routes[path] || requestedUrl || "/";

    try {
      if (target !== "/") {
        const parsed = new URL(target);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") target = "/";
      }
    } catch (e) {
      target = "/";
    }

    document.getElementById("go-btn").href = target;

    let seconds = 8;
    const timerEl = document.getElementById("timer");
    const countdown = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.replace(target);
      }
    }, 1000);
  </script>
