    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 24px 16px; }

    .btn { display: inline-block; padding: 12px 24px; background: #22c55e; color: #052e16; font-weight: 800; border-radius: 8px; text-decoration: none; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Opening Your Requested Site</h2>
    <p>Taking you there in <strong id="timer">8</strong> seconds...</p>

    <div class="ad-box">
      <script type="text/javascript">
        atOptions = {
          'key' : 'e13300f1ce92251ca254f5333f95afce',

        };
      </script>
      <script type="text/javascript" src="//://highrevenueformat.com"></script>
    </div>

    <a id="go-btn" class="btn" href="/">Go Now →</a>
  </div>

  <script>
    const routes = {
      "/go/food": "https://pages.dev",
      "/go/shop": "https://pages.dev",
      "/go/doordash": "https://doordash.com",
      "/go/uber": "https://uber.com",
      "/go/rakuten": "https://rakuten.com",
      "/go/amazon": "https://amazon.com",
      "/go/ibotta": "https://ibotta.com",
      "/go/swagbucks": "https://swagbucks.com",
      "/go/binance": "https://binance.com",
      "/go/bitget": "https://bitget.com",
      "/go/coinbase": "https://coinbase.com",
      "/go/freebitcoin": "https://freebitco.in",
      "/go/distrokid": "https://distrokid.com",
      "/go/signals": "https://pages.dev",
      "/go/music": "https://pages.dev"
    };

    const params = new URLSearchParams(window.location.search);
    const requestedUrl = params.get("url") || params.get("to");
    const path = window.location.pathname.replace(/\/$/, "").toLowerCase();

    let target = routes[path] || requestedUrl || "/";

    try {
      if (target !== "/") {
        const parsed = new URL(target);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") target = "/";
      }
    } catch (e) {
      target = "/";
    }

    document.getElementById("go-btn").href = target;

    let seconds = 8;
    const timerEl = document.getElementById("timer");
    const countdown = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.replace(target);
      }
    }, 1000);
  </script>
