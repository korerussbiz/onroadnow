<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-adsense-account" content="ca-pub-2772533792093956" />
  <title>Shop — Montego Bay Restaurants, Supermarkets & Deals | KorerussBiz</title>
  <script async src="https://googlesyndication.com" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .container { max-width: 1080px; margin: 0 auto; }
    .nav { display: flex; gap: 12px; flex-wrap: wrap; background: #1e293b; padding: 12px; border-radius: 10px; margin-bottom: 18px; }
    .nav a { color: #38bdf8; text-decoration: none; font-weight: 700; }
    h1 { color: #f7931a; margin: 0 0 8px; }
    .ad-banner { background: #020617; border: 1px dashed #475569; padding: 10px; text-align: center; margin-bottom: 18px; border-radius: 10px; overflow: hidden; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border-radius: 12px; padding: 14px; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; background: #0f172a; }
    .price { font-size: 18px; font-weight: 800; color: #4ade80; margin: 6px 0; }
    .btn { display: block; text-align: center; padding: 11px; border-radius: 8px; font-weight: 800; text-decoration: none; margin-top: 8px; }
    .btn.direct { background: #22c55e; color: #052e16; }
    .btn.store { background: #38bdf8; color: #082f49; }
    .btn.affiliate { background: #f7931a; color: #000; }
    .chat-row { display: flex; gap: 6px; margin-top: 6px; }
    .chat-row a { flex: 1; text-align: center; padding: 7px; border-radius: 6px; font-size: 12px; font-weight: 700; text-decoration: none; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/">🏠 Home</a>
      <a href="/food/">🍔 Food & Scanner</a>
      <a href="/shop/">🛒 Shop</a>
      <a href="/business/">🏢 BPO & Airbnb</a>
      <a href="/flyer/">🖨️ QR Flyer</a>
    </div>

    <h1>⚡ Montego Bay Food, Groceries & Global Deals</h1>

    <!-- TOP ADSTERRA LEADERBOARD BANNER -->
    <div class="ad-banner">
      <script type="text/javascript">
        atOptions = {
          'key' : '3a250a252f65294cd6db694d6e4c3edc',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
        document.write('<scr' + 'ipt type="text/javascript" src="//://topcreativeformat.com"></scr' + 'ipt>');
      </script>
    </div>

    <div id="shop-host"><p>Loading products…</p></div>

    <!-- BOTTOM ADSTERRA 300x250 BANNER -->
    <div class="ad-banner" style="margin-top:24px;">
      <script type="text/javascript">
        atOptions = {
          'key' : 'e13300f1ce92251ca254f5333f95afce',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="//://highrevenueformat.com"></script>
    </div>

    <div style="margin-top:18px; padding:16px; background:#1e293b; border-radius:12px; text-align:center;">
      <strong>Chat Only (No Phone Calls):</strong><br/><br/>
      <a href="https://wa.me" target="_blank" style="background:#22c55e;color:#052e16;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;margin:4px;display:inline-block;">💬 WhatsApp</a>
      <a href="https://t.me" target="_blank" style="background:#38bdf8;color:#082f49;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;margin:4px;display:inline-block;">✈️ Telegram</a>
      <a href="https://m.me" target="_blank" style="background:#818cf8;color:#1e1b4b;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;margin:4px;display:inline-block;">💙 Messenger</a>
      <a href="mailto:korerussbiz@gmail.com" style="background:#f7931a;color:#000;padding:8px 14px;border-radius:8px;font-weight:800;text-decoration:none;margin:4px;display:inline-block;">✉️ korerussbiz@gmail.com</a>
    </div>
  </div>

  <script>
    (function () {
      const HOST = document.getElementById("shop-host");
      fetch("/data/products.json?v=" + Date.now())
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(items => {
          let html = '<div class="grid">';
          items.forEach(p => {
            const img = '<img src="' + (p.image || 'https://unsplash.com') + '" alt="' + p.name + '" onerror="this.src=\'https://unsplash.com\'">';
            const price = (p.price != null) ? '<div class="price">$' + Number(p.price).toFixed(2) + ' USD</div>' : '';
            let btn = '', storeBtn = '', extraChat = '';
            if (p.type === "direct") {
              btn = '<a class="btn direct" href="' + p.payment_link + '" target="_blank" rel="noopener">💬 Order Runner via WhatsApp</a>';
              if (p.store_url) {
                storeBtn = '<a class="btn store" href="' + p.store_url + '">🏪 Visit Establishment Site →</a>';
              }
              extraChat = '<div class="chat-row"><a href="https://t.me" target="_blank" style="background:#38bdf8;color:#082f49;">✈️ Telegram</a><a href="https://m.me" target="_blank" style="background:#818cf8;color:#1e1b4b;">💙 Messenger</a></div>';
            } else {
              btn = '<a class="btn affiliate" href="' + p.affiliate_url + '">Open Store / Deal →</a>';
            }
            const note = p.note ? '<div class="note">' + p.note + '</div>' : '';
            html += '<div class="card"><div>' + img + '<h3>' + p.name + '</h3><p style="font-size:14px;color:#cbd5e1;">' + (p.description || '') + '</p></div><div>' + price + storeBtn + btn + extraChat + note + '</div></div>';
          });
          html += '</div>';
          HOST.innerHTML = html;
        })
        .catch(e => { HOST.innerHTML = "<p>Could not load catalog: " + e.message + "</p>"; });
    })();
  </script>
</body>
</html>
