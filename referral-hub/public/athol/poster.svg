<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1a1f3a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#050508" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#a855f7;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00e5ff;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#7c3aed;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ── SUITED SILHOUETTE (visible 0-5s, then 10-15s) ── -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="10s" repeatCount="indefinite"/>
    <!-- head -->
    <ellipse cx="600" cy="255" rx="112" ry="145" fill="#040406"/>
    <!-- suit shoulders -->
    <path d="M 390 630 L 410 470 Q 500 415 600 412 Q 700 415 790 470 L 810 630 Z"
          fill="#08080c"/>
    <!-- lapels -->
    <path d="M 600 412 L 548 500 L 600 558 L 652 500 Z" fill="#0d0d12"/>
    <path d="M 548 500 L 524 520 L 558 558 L 600 558 Z" fill="#111116"/>
    <path d="M 652 500 L 676 520 L 642 558 L 600 558 Z" fill="#111116"/>
    <!-- eyes -->
    <g filter="url(#eyeGlow)">
      <ellipse cx="554" cy="245" rx="25" ry="11" fill="url(#holo)"/>
      <ellipse cx="646" cy="245" rx="25" ry="11" fill="url(#holo)"/>
      <circle cx="554" cy="245" r="5" fill="#000"/>
      <circle cx="646" cy="245" r="5" fill="#000"/>
      <circle cx="558" cy="241" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="650" cy="241" r="2" fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <!-- ── CASUAL SILHOUETTE (visible 5-10s) ── -->
  <g>
    <animate attributeName="opacity" values="0;0;1;1;0" dur="10s" repeatCount="indefinite"/>
    <!-- head -->
    <ellipse cx="600" cy="255" rx="110" ry="142" fill="#040406"/>
    <!-- hoodie / casual shoulders -->
    <path d="M 395 630 L 412 465 Q 500 420 600 418 Q 700 420 788 465 L 805 630 Z"
          fill="#0a0a0e"/>
    <!-- hood collar -->
    <path d="M 530 430 Q 600 475 670 430 L 660 455 Q 600 495 540 455 Z" fill="#0d0d12"/>
    <!-- drawstrings -->
    <line x1="575" y1="460" x2="572" y2="520" stroke="#1f1f2a" stroke-width="3"/>
    <line x1="625" y1="460" x2="628" y2="520" stroke="#1f1f2a" stroke-width="3"/>
    <!-- eyes (same stare) -->
    <g filter="url(#eyeGlow)">
      <ellipse cx="554" cy="245" rx="25" ry="11" fill="url(#holo)"/>
      <ellipse cx="646" cy="245" rx="25" ry="11" fill="url(#holo)"/>
      <circle cx="554" cy="245" r="5" fill="#000"/>
      <circle cx="646" cy="245" r="5" fill="#000"/>
      <circle cx="558" cy="241" r="2" fill="#fff" opacity="0.9"/>
      <circle cx="650" cy="241" r="2" fill="#fff" opacity="0.9"/>
    </g>
  </g>

  <!-- Brow shadow -->
  <path d="M 522 232 L 584 226" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <path d="M 678 232 L 616 226" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Holographic rim -->
  <path d="M 490 255 Q 490 185 600 178 Q 710 185 710 255"
        fill="none" stroke="url(#holo)" stroke-width="2" opacity="0.5"/>

  <!-- Wordmark: ATHOL (fixed) -->
  <text x="600" y="560" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="20"
        fill="url(#holo)">ATHOL</text>
  <text x="600" y="598" text-anchor="middle"
        font-family="system-ui, Arial, sans-serif" font-size="15"
        letter-spacing="8" fill="#6b7280">FILM · TOKEN · FUTURE</text>
</svg>
