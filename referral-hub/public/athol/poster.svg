<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#1a1f3a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#050508" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff">
        <animate attributeName="stop-color"
                 values="#00e5ff;#a855f7;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color"
                 values="#a855f7;#00e5ff;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e5ff">
        <animate attributeName="stop-color"
                 values="#00e5ff;#7c3aed;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="scan">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Black field -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Head silhouette: dark face, only eyes visible -->
  <ellipse cx="600" cy="270" rx="118" ry="152" fill="#050507"/>
  <path d="M 482 270 Q 482 190 600 180 Q 718 190 718 270
           Q 718 350 600 430 Q 482 350 482 270 Z"
        fill="#030305"/>

  <!-- Suit shoulders -->
  <path d="M 380 630 L 400 470 Q 500 415 600 412 Q 700 415 800 470 L 820 630 Z"
        fill="url(#suit)"/>
  <!-- Lapels -->
  <path d="M 600 412 L 545 500 L 600 560 L 655 500 Z" fill="#08080c"/>
  <path d="M 545 500 L 520 520 L 555 560 L 600 560 Z" fill="#0a0a10"/>
  <path d="M 655 500 L 680 520 L 645 560 L 600 560 Z" fill="#0a0a10"/>

  <!-- THE EYES — the only light in the image -->
  <g filter="url(#eyeGlow)">
    <ellipse cx="552" cy="252" rx="26" ry="12" fill="url(#holo)"/>
    <ellipse cx="648" cy="252" rx="26" ry="12" fill="url(#holo)"/>
    <!-- pupils: serious, forward stare -->
    <circle cx="552" cy="252" r="5" fill="#000"/>
    <circle cx="648" cy="252" r="5" fill="#000"/>
    <!-- catchlight -->
    <circle cx="556" cy="248" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="652" cy="248" r="2" fill="#fff" opacity="0.9"/>
  </g>

  <!-- Brow shadow for the serious stare -->
  <path d="M 520 236 L 584 230" stroke="#000" stroke-width="7" stroke-linecap="round"/>
  <path d="M 680 236 L 616 230" stroke="#000" stroke-width="7" stroke-linecap="round"/>

  <!-- Holographic rim light on the silhouette -->
  <path d="M 482 270 Q 482 190 600 180 Q 718 190 718 270"
        fill="none" stroke="url(#holo)" stroke-width="2" opacity="0.55"/>
  <path d="M 400 470 Q 500 415 600 412 Q 700 415 800 470"
        fill="none" stroke="url(#holo)" stroke-width="1.5" opacity="0.35"/>

  <!-- Wordmark -->
  <text x="600" y="560" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="86" font-weight="800" letter-spacing="18"
        fill="url(#holo)">ATHOL</text>
  <text x="600" y="596" text-anchor="middle"
        font-family="system-ui, sans-serif" font-size="15"
        letter-spacing="7" fill="#6b7280">FILM · TOKEN · FUTURE</text>

  <!-- Scanline texture -->
  <rect width="1200" height="630" fill="#fff" filter="url(#scan)" opacity="0.5"/>
</svg>
