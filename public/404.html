<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparing Your Deal...</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 24px 16px; }
    .box { max-width: 560px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; }
    .ad-box { margin: 20px auto; padding: 12px; border: 1px dashed #64748b; background: #020617; min-height: 260px; display: flex; justify-content: center; align-items: center; }
    .btn { display: inline-block; padding: 12px 24px; background: #22c55e; color: #052e16; font-weight: 700; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Unlocking Your Partner Offer</h2>
    <p>Redirecting automatically in <strong id="timer">20</strong> seconds...</p>

    <div class="ad-box">
      <script type="text/javascript">
        atOptions = {
          'key' : '3a250a252f65294cd6db694d6e4c3edc',
          'format' : 'iframe',
          'height' : 250,
          'width' : 300,
          'params' : {}
        };
        document.write('<scr' + 'ipt type="text/javascript" src="//://topcreativeformat.com"></scr' + 'ipt>');
      </script>
    </div>

    <a id="go-btn" class="btn" href="/">Continue to Destination</a>
  </div>

  <script>
    const referralRoutes = {
      "/go/food": "https://pages.dev",
      "/go/doordash": "https://doordash.com",
      "/go/uber": "https://uber.com",
      "/go/rakuten": "https://rakuten.com",
      "/go/binance": "https://binance.com",
      "/go/coinbase": "https://coinbase.com",
      "/go/freebitcoin": "https://freebitco.in",
      "/go/distrokid": "https://distrokid.com",
      "/go/signals": "https://pages.dev"
    };

    const currentPath = window.location.pathname.replace(/\/$/, "").toLowerCase();
    let target = referralRoutes[currentPath] || "/";

    try {
      if (target !== "/") new URL(target);
    } catch (e) {
      target = "/";
    }

    document.getElementById("go-btn").href = target;

    let secondsLeft = 20;
    const timerEl = document.getElementById("timer");
    const countdown = setInterval(() => {
      secondsLeft--;
      timerEl.textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(countdown);
        window.location.replace(target);
      }
    }, 1000);
  </script>
</body>
</html>
